name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: nixos-server
    timeout-minutes: 60
    steps:
      # Forgejo's :3000 is HTTPS (tailscale cert); plaintext HTTP gets a 400.
      # The job token authenticates even if the repo turns private again, and
      # sslVerify is off because the runner does not trust the tailscale CA.
      - name: Checkout
        env:
          CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git clone --depth 1 "https://${{ github.token }}@pearss.example.ts.net:3000/lllzt/Pearss.git" source
          cd source
          git remote set-url origin "./source"
          git -c http.sslVerify=false fetch --depth 1 origin "$CI_SHA"
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$CI_SHA"

      - name: Run quality gates
        working-directory: source
        env:
          NIX_CONFIG: |
            max-jobs = 1
            cores = 2
        run: nix develop --command just ci
