name: CI

# Feature branches and pull requests gate every push; main is deliberately
# excluded (merges land exactly at the CI-passed branch tip, so a second run
# would only burn the shared runner) and stays available on demand through
# workflow_dispatch.
on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: nixos-server
    timeout-minutes: 60
    steps:
      # The runner does not trust the certificate on Forgejo's HTTPS endpoint.
      # A full clone, not --depth 1: the coverage gate diffs the pushed commit
      # against origin/main, which a single-branch shallow checkout does not
      # have (that is exactly how the first gated runs failed).
      - name: Checkout
        env:
          CI_SHA: ${{ github.sha }}
          CI_TOKEN: ${{ github.token }}
        run: |
          set -eu
          repository="https://git.example.com:3000/lllzt/Pearss.git"
          trap 'if [ -d source/.git ]; then git -C source remote set-url origin "$repository"; fi' EXIT
          git -c http.sslVerify=false clone \
            "https://${CI_TOKEN}@git.example.com:3000/lllzt/Pearss.git" source
          git -C source fetch origin "$CI_SHA"
          git -C source -c advice.detachedHead=false checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$CI_SHA"

      - name: Run quality gates
        working-directory: source
        env:
          NIX_CONFIG: |
            max-jobs = 1
            cores = 2
        run: nix develop --command just ci
