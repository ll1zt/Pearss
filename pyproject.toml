[project]
name = "pearss"
version = "0.1.0"
description = "Single-user, agent-first RSS+ system"
readme = "README.md"
# Python 3.13 is the floor and the CI target. The Nix flake pins the same
# series, so the interpreter here and the one in `nix develop` agree.
requires-python = ">=3.13,<3.14"

# Per architecture section 10.1, uv owns the Python dependency graph and Nix
# owns the interpreter and system libraries. Nothing here should be mirrored
# into flake.nix, and nothing that flake.nix provides should be added here.
#
# Only dependencies the skeleton actually uses belong in this list. The rest of
# the P1 stack (fastapi, fastmcp, httpx, feedparser, apscheduler, structlog)
# arrives with the component that first needs it.
dependencies = [
  "alembic>=1.18",
  "fastapi>=0.141.1",
  "feedparser>=6.0.14",
  "httpx>=0.28.1",
  "lxml>=6.1.3",
  "python-multipart>=0.0.32",
  "sqlalchemy>=2.0",
  "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
  "import-linter>=2.1",
  "lxml-stubs>=0.5.1",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = ["core", "adapters", "plugins", "app"]

# --------------------------------------------------------------------------
# ruff: formatter and linter. `S` (flake8-bandit) is enabled because the
# OpenSSF checklist expects SAST in CI, not just style.
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# assert is the correct tool in tests (ruff's S101 flags it because asserts
# vanish under -O, which is a real concern in production code and not in a
# test). Applies to tests/ and to the collector fixture tests that live
# beside their fixtures under src/.
"tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
# FastAPI resolves Form(...) and Query(...) defaults at import time by
# design; they are not mutable defaults in the usual sense. Scoped to the
# route modules rather than disabled project-wide.
"src/app/reader_routes.py" = ["B008"]
# S105/S106 key on names containing "password", so a test fixture credential
# trips them no matter how it is named. The credential is generated per test
# and injected via monkeypatch; it is never a real secret.
"tests/integration/test_reader_api.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["core", "adapters", "plugins", "app"]

# --------------------------------------------------------------------------
# mypy: strict, because the domain invariants in docs/domain/ are only worth
# their weight if the compiler enforces the enum and state types behind them.
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# feedparser ships no type information and none exists on PyPI. Scoped to this
# one module rather than disabling import checks globally, so a genuinely
# untyped dependency elsewhere still gets flagged.
[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

# --------------------------------------------------------------------------
# pytest: warnings are errors so deprecations fail loudly, and markers are
# declared so a typo in `-m` does not silently select zero tests.
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# strict mode: every async test must opt in with a marker, so a test silently
# skipped for want of a plugin cannot pass unnoticed.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# src/ is included because fixture tests live beside their collector: the
# snapshot and the parser it pins belong together, and a parser moved without
# its fixtures is a parser that stops being verified.
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
  "unit: pure domain logic, no I/O",
  "fixture: recorded RSS/HTML snapshot parsing",
  "integration: adapters against SQLite or temp services",
  "contract: OpenAPI diff and MCP tool snapshots",
  "e2e: full compose stack",
]

# --------------------------------------------------------------------------
# import-linter: enforces the one-way dependency rule from AGENTS.md.
#
# Layers are listed highest-level first. A higher layer may import from a
# lower one; the reverse is a contract violation. app sits at the top and core
# at the bottom, which is what "core -> adapters -> plugins -> app" means.
# --------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["core", "adapters", "plugins", "app"]

[[tool.importlinter.contracts]]
name = "Four-layer architecture: app -> plugins -> adapters -> core"
type = "layers"
layers = ["app", "plugins", "adapters", "core"]
